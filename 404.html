<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <!-- GitHub Pages отдаёт эту страницу на любой несуществующий адрес. Сайт использует адреса с «#» (…/#/budget),
         поэтому старые ссылки и закладки без «#» (…/budget, …/manager/dudina) перенаправляются на ту же страницу с «#».
         Адрес сайта (корень домена или папка репозитория) определяется отбрасыванием пути страницы. -->
    <script>
      (function () {
        var location = window.location
        var page = /\/(login|compare|budget|results|forbidden|manager\/[^/]+)\/?$/
        var match = location.pathname.match(page)
        var base = match ? location.pathname.slice(0, match.index + 1) : location.pathname.replace(/[^/]*$/, '')
        var route = match ? '/' + match[1] : '/'
        location.replace(base + '#' + route + location.search)
      })()
    </script>
  </head>
  <body></body>
</html>
